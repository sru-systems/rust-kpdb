[package]
name = "rust-kpdb"
version = "0.6.0"
edition = "2021"
license = "MIT/Apache-2.0"
description = "Library for reading/writing KeePass 2 and KeePassX databases."
documentation = "https://docs.sru-systems.com/rust-kpdb/0.6.0/kpdb/"
homepage = "https://github.com/sru-systems/rust-kpdb"
repository = "https://github.com/sru-systems/rust-kpdb"
readme = "README.md"
keywords = ["keepass", "keepassx", "kdbx"]

[package.metadata]
authors = ["Martijn Rijkeboer <mrr@sru-systems.com>"]

[lib]
name = "kpdb"

[dependencies]
aes = "0.8"
argon2 = "0.5"
base64 = "0.22"
block-padding = "0.4"
byteorder = "1"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
chrono = "0.4"
cipher = "0.4"
flate2 = "1.1"
hex = "0.4.3"
hmac = "0.13"
rand = "0.8"
salsa20 = "0.11"
chacha20 = "0.9"
secstr = "0.5.1"
sha2 = "0.11"
uuid = { version = "1.23", features = ["v4"] }
xml-rs = "1.0"

[dev-dependencies]
quickcheck = "1.0.3"

